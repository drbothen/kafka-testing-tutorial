[project]
name = "kafka-testing-tutorial"
version = "0.1.0"
description = "End-to-end testing tutorial for Kafka-based applications using pytest and testcontainers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "confluent-kafka>=2.6.0",
    "pydantic>=2.0.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-timeout>=2.1.0",
    "testcontainers[kafka,postgres]>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alert_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
